<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bits to bits</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="stage" id="stage">
      <section class="pane atelier" id="atelier" aria-label="Sculpt">
        <canvas class="gl" id="atelier-canvas"></canvas>
        <canvas class="overlay2d" id="hand-canvas"></canvas>
        <video id="camera" playsinline muted></video>

        <header class="pane-head">
          <span class="brand">bits to bits</span>
          <div class="head-right">
            <nav class="materials" id="materials" aria-label="Material"></nav>
            <span class="dim num" id="specimen-no">Form 1</span>
          </div>
        </header>

        <footer class="pane-foot">
          <ol class="tools" id="tools"></ol>
          <div class="actions-row">
            <button class="btn ghost" id="btn-reset">Start over</button>
            <button class="btn primary" id="btn-accept">Keep this form</button>
          </div>
        </footer>

        <div class="accept-ring" id="accept-ring" hidden>
          <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54" /><circle class="fill" cx="60" cy="60" r="54" /></svg>
          <span>Keeping</span>
        </div>

        <div class="status" id="status" hidden></div>

        <div class="sheet intro" id="intro">
          <div class="sheet-inner">
            <h2 class="display">bits to bits</h2>
            <p class="lead">Shape a form with your hands. Every form you keep finds its relatives.</p>
            <div class="actions">
              <button class="btn primary large" id="btn-calibrate">Start with camera</button>
              <button class="btn ghost large" id="btn-pointer">Use mouse instead</button>
            </div>
            <p class="fine dim">Video stays on this device.</p>
          </div>
        </div>

        <div class="calibration" id="calibration" hidden>
          <div class="calib-head">
            <h2 class="calib-title" id="calib-title">Show your open hand</h2>
            <p class="calib-sub dim" id="calib-sub">About an arm's length from the screen.</p>
          </div>
          <ol class="poses" id="poses"></ol>
          <div class="signature" id="hand-signature" hidden></div>
        </div>
      </section>

      <div class="seam" id="seam" role="separator" aria-orientation="vertical" title="Drag to resize"></div>

      <section class="pane field" id="field" aria-label="Collection">
        <canvas class="gl" id="field-canvas"></canvas>
        <div class="labels" id="field-labels"></div>

        <header class="pane-head">
          <span class="brand">Collection</span>
          <span class="dim num" id="field-count">Empty</span>
        </header>

        <aside class="inspector" id="inspector" hidden></aside>

        <footer class="pane-foot">
          <span></span>
          <div class="actions-row">
            <button class="btn ghost" id="btn-seed">Add samples</button>
            <button class="btn ghost" id="btn-clear">Clear</button>
          </div>
        </footer>

        <div class="empty" id="field-empty"><p>Forms you keep will gather here.</p></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
